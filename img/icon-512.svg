<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>SCS Play</title>
  <defs>
    <linearGradient id="night" x2=".65" y2="1">
      <stop stop-color="#34315A"/><stop offset=".51" stop-color="#1C263E"/><stop offset="1" stop-color="#0B1625"/>
    </linearGradient>
    <radialGradient id="light"><stop stop-color="#8277C4" stop-opacity=".48"/><stop offset="1" stop-color="#8277C4" stop-opacity="0"/></radialGradient>
    <linearGradient id="ice" gradientUnits="userSpaceOnUse" x1="268" y1="95" x2="298" y2="219">
      <stop stop-color="#F9F0FE"/><stop offset=".45" stop-color="#DBCAF5"/><stop offset="1" stop-color="#9E91CE"/>
    </linearGradient>
    <linearGradient id="violet" gradientUnits="userSpaceOnUse" x1="275" y1="111" x2="325" y2="233">
      <stop stop-color="#8C68AC"/><stop offset=".52" stop-color="#7E7CB7"/><stop offset="1" stop-color="#514880"/>
    </linearGradient>
    <linearGradient id="mint" gradientUnits="userSpaceOnUse" x1="202" y1="294" x2="242" y2="391">
      <stop stop-color="#FBF5DC"/><stop offset=".39" stop-color="#A6ECE0"/><stop offset="1" stop-color="#73ACD0"/>
    </linearGradient>
    <linearGradient id="twilight" gradientUnits="userSpaceOnUse" x1="247" y1="280" x2="259" y2="399">
      <stop stop-color="#4A537E"/><stop offset=".48" stop-color="#7996B7"/><stop offset="1" stop-color="#C1BAE2"/>
    </linearGradient>
  </defs>
  <!-- Full bleed for maskable launchers. The outer instrument ring can be cropped. -->
  <rect width="512" height="512" fill="url(#night)"/>
  <circle cx="256" cy="248" r="224" fill="url(#light)"/>
  <g fill="none" stroke="#DFE0FF">
    <circle cx="256" cy="256" r="199" opacity=".17" stroke-width="2"/>
    <circle cx="256" cy="256" r="209" opacity=".22" stroke-width="4" stroke-dasharray="1 13"/>
    <path d="M256 39v18m0 398v18M39 256h18m398 0h18" opacity=".5" stroke-width="3"/>
  </g>
  <g id="brand-mark">
    <!-- The compass stations retain the four original silhouettes and their fixed colours. -->
    <path fill="#A64860" d="m156 151 92 74-4 8z"/>
    <path fill="#6E70C9" d="m361 149-84 97-6-6z"/>
    <path fill="#59A59A" d="m145 383 58-66 2 7z"/>
    <path fill="#B49978" d="m363 386-98-106 5-7z"/>
    <!-- A split, tilted crystal: its dark diagonal cleavage remains legible at launcher size. -->
    <path data-ink="true" fill="#F3ECFF" d="m280 77 51 157-131 48 9-66z"/>
    <path fill="#AFBAF5" d="m280 77-31 148-40-9z"/>
    <path fill="url(#violet)" d="m280 77 51 157-46-15z"/>
    <path fill="url(#ice)" d="m280 77 5 142-36 6z"/>
    <path fill="#79ADC6" d="m209 216 40 9-49 57z"/>
    <path fill="#C2F7ED" d="m249 225 36-6-85 63z"/>
    <path fill="#E5FFFB" d="m200 282 85-63 46 15z"/>
    <path data-ink="true" fill="#B0B9EB" d="m332 247-38 83-67 105-26-138z"/>
    <path fill="url(#mint)" d="m201 297 50-18-24 156z"/>
    <path fill="url(#twilight)" d="m251 279 43 51-67 105z"/>
    <path fill="#A7A5EB" d="m251 279 81-32-38 83z"/>
    <path fill="#EDFFFD" d="m201 297 131-50-81 39z"/>
    <path fill="#F7FBFF" d="m280 77-29 129-6 13z"/>
    <path fill="#D8FFFB" d="m234 359 9-49-14 89z"/>
    <path data-ink="true" fill="#FF4757" d="M150 116a35 35 0 1 1 0 70 35 35 0 0 1 0-70z"/>
    <path fill="#FF949B" d="M120 139q11-28 39-16-25-4-39 16z"/>

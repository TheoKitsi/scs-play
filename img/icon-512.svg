    <path fill="#A8B0FF" d="M341 124h40q7 0 8 8-4-4-10-4h-40z"/>
    <path data-ink="true" fill="#2ED573" d="m149 337 38 65h-73z"/>
    <path fill="#9BF4C6" d="m149 337-23 57-12 8z"/>
    <path data-ink="true" fill="#FFA502" d="M363 333l12 27 30 4-22 21 4 26-24-13-27 16 6-30-22-20 30-4z"/>
    <path fill="#FFDD92" d="m363 333-4 33-39-2 30-4z"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#263141"/>
      <stop offset="50%" stop-color="#111824"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#CAD4E3" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dy="4"/>
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="material" x1=".15" y1="0" x2=".85" y2="1"><stop stop-color="#fff" stop-opacity=".55"/><stop offset=".36" stop-color="#fff" stop-opacity="0"/><stop offset=".62" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".28"/></linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="200" fill="url(#glow)"/>

  <g id="brand-mark">
  <!-- Top-left: Red circle -->
  <circle cx="130" cy="130" r="48" fill="#FF4757" filter="url(#softShadow)"/>
  <circle cx="130" cy="130" r="48" fill="url(#material)"/>

  <!-- Top-right: Blue rounded square -->
  <rect x="334" y="82" width="96" height="96" rx="18" fill="#3742FA" filter="url(#softShadow)"/>
  <rect x="334" y="82" width="96" height="96" rx="18" fill="url(#material)"/>

  <!-- Bottom-left: Green triangle -->
  <polygon points="130,334 186,430 74,430" fill="#2ED573" filter="url(#softShadow)"/>
  <polygon points="130,334 186,430 74,430" fill="url(#material)"/>

  <!-- Bottom-right: Orange star -->
  <polygon points="382,340 396,378 436,382 406,406 414,446 382,428 350,446 358,406 328,382 368,378" fill="#FFA502" filter="url(#softShadow)"/>
  <polygon points="382,340 396,378 436,382 406,406 414,446 382,428 350,446 358,406 328,382 368,378" fill="url(#material)"/>

  <!-- Center swipe trail -->
  <path d="M256,276 Q220,240 180,200" stroke="white" stroke-width="3" fill="none" opacity="0.25" stroke-linecap="round"/>
  <path d="M256,276 Q240,260 200,220" stroke="white" stroke-width="2" fill="none" opacity="0.12" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="256" cy="276" r="18" fill="white" opacity="0.9"/>
  <circle cx="256" cy="276" r="12" fill="#7C3AED"/>
  <circle cx="252" cy="272" r="4" fill="white" opacity="0.35"/>

  </g>
</svg>

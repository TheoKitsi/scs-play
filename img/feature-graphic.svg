<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#192231"/>
      <stop offset="40%" stop-color="#111824"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>
    <radialGradient id="fglow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#CAD4E3" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="material" x1=".15" y1="0" x2=".85" y2="1"><stop stop-color="#fff" stop-opacity=".55"/><stop offset=".36" stop-color="#fff" stop-opacity="0"/><stop offset=".62" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".28"/></linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="500" fill="url(#fbg)"/>
  <rect width="1024" height="500" fill="url(#fglow)"/>

  <!-- The same four material silhouettes as the app. -->
  <!-- Top-left: Red circle -->
  <circle cx="180" cy="140" r="55" fill="#FF4757"/>
  <circle cx="180" cy="140" r="55" fill="url(#material)"/>

  <!-- Top-right: Blue square -->
  <rect x="790" y="85" width="110" height="110" rx="20" fill="#3742FA"/>
  <rect x="790" y="85" width="110" height="110" rx="20" fill="url(#material)"/>

  <!-- Bottom-left: Green triangle -->
  <polygon points="180,310 240,420 120,420" fill="#2ED573"/>
  <polygon points="180,310 240,420 120,420" fill="url(#material)"/>

  <!-- Bottom-right: Orange star -->
  <polygon points="845,310 860,355 905,360 872,388 882,432 845,412 808,432 818,388 785,360 830,355" fill="#FFA502"/>
  <polygon points="845,310 860,355 905,360 872,388 882,432 845,412 808,432 818,388 785,360 830,355" fill="url(#material)"/>

  <text x="512" y="235" fill="#F4F7FC" font-family="'Outfit','Segoe UI',sans-serif" font-size="68" font-weight="700" text-anchor="middle" letter-spacing="-3">SCS Play</text>
  <text x="512" y="280" fill="#C4CEDD" font-family="'Outfit','Segoe UI',sans-serif" font-size="22" font-weight="400" text-anchor="middle">Sort · Think · React</text>
</svg>
